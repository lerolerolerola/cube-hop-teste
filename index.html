<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cube Hop">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<meta name="theme-color" content="#1b1f4b">
<title>Cube Hop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=44">
</head>
<body>
<canvas id="game"></canvas>

<div id="hud" class="hidden">
  <span id="cubes" data-t-title="hud.cubes">:gem: 0</span>
  <span id="level"></span>
  <span id="pet" class="hidden"></span>
  <div id="time"><span id="autoLv" data-t-title="hud.autonomy">:trophy: LV 1</span><span id="playTime" data-t-title="hud.time">:clock:<i id="timeBar"><b id="timeFill"></b><i id="breakMark"></i></i><span id="clock"></span></span></div>
  <button id="devBtn" class="icon hidden" data-t-label="hud.dev">:dev:</button>
  <button id="calmBtn" class="icon hidden" data-t-label="hud.calm">:breathe:</button>
  <button id="mute" class="icon" data-t-label="hud.sound">:sound:</button>
  <button id="pause" class="icon" data-t-label="hud.pause">:pause:</button>
</div>

<div id="pad" class="hidden">
  <div id="dpad"><b class="u">:up:</b><b class="l">:left:</b><i></i><b class="r">:right:</b><b class="d">:down:</b></div>
  <div id="ab"><button id="bB">B</button><button id="bA">A</button></div>
</div>

<div id="hint"></div>

<div id="title" class="screen">
  <h1>CUBE<br>HOP</h1>
  <div id="petTitle" class="hidden"></div>
  <div id="pick" class="btns"><button id="withPip"></button><button id="noPip" data-t="title.noPip"></button></div>
  <p id="weekInfo"></p>
  <div class="btns">
    <button id="continue" data-t="title.continue"></button>
    <button id="newGame" data-t="title.newGame"></button>
    <button id="resetWeek" data-t="title.resetTime"></button>
  </div>
  <p class="pc" data-t="title.pcHelp"></p>
  <div class="btns"><button id="howTo" class="ghost" data-t="title.howTo"></button><button id="parents" class="ghost" data-t="title.grownUps"></button></div>
</div>

<div id="modal" class="screen hidden"></div>

<script src="lang.js?v=44"></script>
<script src="levels.js?v=44"></script>
<script src="icons.js?v=44"></script>
<script>for (const e of document.querySelectorAll('#hud, #pad, #title')) e.innerHTML = icons(e.innerHTML); applyText();</script>
<script src="game.js?v=44"></script>
<script src="session.js?v=44"></script>
<script src="mascot.js?v=44"></script>
<script>
// A file that didn't load (weak connection) leaves a blue screen with the D-pad icons as text: reload once.
try {
  if ([typeof icons, typeof tr, typeof loadLevel, typeof startSession, typeof petSVG].some(t => t !== 'function')) {
    if (!sessionStorage.getItem('retried')) { sessionStorage.setItem('retried', 1); location.reload(); }
  } else sessionStorage.removeItem('retried');
} catch {}
navigator.serviceWorker?.register('sw.js').catch(() => {});
if (typeof tutorial === 'function' && (!get('tutorial', false) || new URLSearchParams(location.search).has('tutorial'))) tutorial();
</script>
</body>
</html>
